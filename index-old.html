<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgenticsCove</title>
    <style>
      :root {
        --bg: #06131f;
        --panel: #0e2333;
        --accent: #7dd3fc;
        --accent-2: #a78bfa;
        --text: #e5f3ff;
        --muted: #9ab6c9;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #102a3d, var(--bg) 55%);
        color: var(--text);
      }

      .card {
        width: min(90vw, 720px);
        background: rgba(14, 35, 51, 0.9);
        border: 1px solid rgba(125, 211, 252, 0.25);
        border-radius: 20px;
        padding: 3rem 2.5rem;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 0.8rem;
        color: var(--accent);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.75rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.1;
      }

      .tagline {
        margin: 1rem auto 0;
        max-width: 42rem;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .cta-row {
        margin-top: 2rem;
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .button {
        display: inline-block;
        padding: 0.9rem 1.4rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        opacity: 0.95;
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #041722;
      }

      .secondary {
        border: 1px solid rgba(167, 139, 250, 0.4);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Welcome</p>
      <h1>AgenticsCove</h1>
      <p class="tagline">
        A calm, focused place for AI-driven ideas, workflows, and digital experiences.
      </p>

      <div class="cta-row">
        <a class="button primary" href="#">Explore</a>
        <a class="button secondary" href="#">Learn More</a>
      </div>
    </main>
  </body>
</html>
